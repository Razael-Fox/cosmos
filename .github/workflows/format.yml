name: Prettier Auto-Format

on:
    push:
        branches: [main]

permissions:
    contents: write

# Serialize with version-automation.yml: both may push bot commits to main,
# and a lost race would fail the push with a non-fast-forward rejection.
concurrency:
    group: main-automation
    cancel-in-progress: false

jobs:
    format:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup PNPM
              uses: pnpm/action-setup@v4
              with:
                  version: 12.3.4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Prettier across the codebase
              run: pnpm exec prettier --write . --log-level warn

            - name: Commit and push formatting changes
              # [skip ci] — formatting never needs CI or a version bump
              # (Rule S.1 exempts format/whitespace-only changes), and the tag
              # prevents this workflow from retriggering itself.
              run: |
                  if git diff --quiet; then
                      echo "Codebase already formatted — nothing to commit."
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -am "style: prettier auto-format [skip ci]"
                  # Another automation may have pushed while formatting ran.
                  git pull --rebase origin main
                  git push origin HEAD:main
                  echo "Formatting changes pushed."
