name: Publish Docker Image to GHCR

on:
    push:
        tags:
            # Cosmos version format: G<generation>-F<feature>-P<patch>[.date][-status]
            - 'G[0-9]*-F[0-9]*-P[0-9]*'
    # version-automation.yml triggers this workflow via the Actions API
    # (gh workflow run) because git pushes made with GITHUB_TOKEN — and
    # observed with the configured PAT — do not start downstream runs.
    workflow_dispatch:
        inputs:
            tag:
                description: 'Version tag to build (e.g. G2-F32-P0)'
                required: true

# One build per tag at a time: a PAT-triggered tag push and the
# API dispatch cannot run concurrently for the same tag.
concurrency:
    group: docker-${{ github.event.inputs.tag || github.ref_name }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: razael-fox/cosmos

jobs:
    build-and-push:
        runs-on: [self-hosted, linux, debian]

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  # Empty on tag pushes (checks out the triggering tag);
                  # set by workflow_dispatch.
                  ref: ${{ inputs.tag }}

            - name: Checkout api worktree
              uses: actions/checkout@v4
              with:
                  ref: api
                  path: .worktrees/api

            - name: Checkout website worktree
              uses: actions/checkout@v4
              with:
                  ref: website
                  path: .worktrees/website

            - name: Setup pnpm toolchain
              shell: bash
              run: |
                  corepack enable
                  pnpm config set package-import-method copy
                  pnpm config set store-dir "$HOME/.pnpm-store"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Validate version metadata
              run: |
                  cat version.json
                  pnpm run version:check

            - name: Validate release tag
              env:
                  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
              run: |
                  canonical_version=$(node -p "JSON.parse(require('fs').readFileSync('version.json', 'utf8')).version")
                  if [[ "$RELEASE_TAG" =~ ^(G[0-9]+-F[0-9]+-P[0-9]+)([.-].*)?$ ]]; then
                      tag_version="${BASH_REMATCH[1]}"
                  else
                      echo "Invalid release tag: $RELEASE_TAG" >&2
                      exit 1
                  fi
                  if [[ "$tag_version" != "$canonical_version" ]]; then
                      echo "Release tag '$RELEASE_TAG' does not match version.json '$canonical_version'." >&2
                      exit 1
                  fi

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=ref,event=tag
                      type=raw,value=latest

            - name: Check disk space
              run: |
                  df -h /
                  docker system df

            - name: Prune builder cache if low on disk
              run: |
                  AVAIL=$(df / | awk 'NR==2 {print $4}')
                  if [ "$AVAIL" -lt 10485760 ]; then
                    echo "Disk space below 10GB, trimming builder cache and dangling images..."
                    docker image prune -f || true
                    docker builder prune -f --reserved-space 2GB || true
                  fi

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: docker/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '1x00000000000000000000AA' }}
                      NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://cosmos.razael-fox.my.id' }}
                      NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'https://cosmos.razael-fox.my.id' }}
                      NEXT_PUBLIC_BOT_NUMBER=${{ secrets.NEXT_PUBLIC_BOT_NUMBER }}
                      NEXT_PUBLIC_SALES_NUMBER=${{ secrets.NEXT_PUBLIC_SALES_NUMBER }}

            - name: Verify pushed image
              run: |
                  docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
                    | grep -E '"digest"|"mediaType"' | head -6

            - name: Post-build cleanup
              if: always()
              run: |
                  echo "Pruning dangling images and trimming builder cache..."
                  docker image prune -f || true
                  docker builder prune -f --reserved-space 2GB || true
                  df -h /
