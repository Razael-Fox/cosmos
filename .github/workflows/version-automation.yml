name: Version Automation

on:
    push:
        branches: [main]

permissions:
    contents: write

jobs:
    auto-version:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Resolve tag state for the current version
              run: |
                  VERSION=$(node -p "require('./version.json').version")
                  echo "Current version.json: $VERSION"
                  if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
                      echo "Tag $VERSION already exists — nothing to do."
                      echo "DONE=true" >> "$GITHUB_ENV"
                  fi

            - name: Classify the push
              if: env.DONE != 'true'
              run: |
                  CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
                  if echo "$CHANGED" | grep -qx 'version.json'; then
                      echo "Push already carried a version bump — tagging HEAD only."
                      echo "MODE=tag-only" >> "$GITHUB_ENV"
                  elif echo "$CHANGED" | grep -qE '^(src|prisma|scripts|docker)/|^\.github/workflows/'; then
                      echo "Versioned paths changed without a version.json bump — auto-bumping patch."
                      echo "MODE=bump" >> "$GITHUB_ENV"
                  else
                      echo "No versioned paths changed — nothing to do."
                      echo "DONE=true" >> "$GITHUB_ENV"
                  fi

            - name: Setup PNPM
              if: env.MODE == 'bump'
              uses: pnpm/action-setup@v4
              with:
                  version: 12.3.4

            - name: Setup Node.js
              if: env.MODE == 'bump'
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              if: env.MODE == 'bump'
              run: pnpm install --frozen-lockfile

            - name: Auto-bump patch version
              # Only `patch` can be inferred automatically; feature/generation
              # milestones stay a human decision via `pnpm run version:bump`.
              if: env.MODE == 'bump'
              run: |
                  pnpm run version:bump patch
                  pnpm run version:check
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  NEW_VERSION=$(node -p "require('./version.json').version")
                  RELEASE_DATE=$(node -p "require('./version.json').releaseDate")

                  # Stub CHANGELOG section built from the push's commit subjects
                  # (deterministic extraction, not authored text), so release.yml
                  # always finds a `## [<version>]` section to slice out.
                  {
                      echo ""
                      echo "## [$NEW_VERSION] - $RELEASE_DATE"
                      echo ""
                      echo "### Changed — Automated patch release"
                      echo ""
                      git log --format='- %s' "${{ github.event.before }}..${{ github.sha }}"
                      echo ""
                      echo "---"
                  } > section.md
                  INSERT_LINE=$(grep -n '^---$' CHANGELOG.md | head -1 | cut -d: -f1)
                  head -n "$INSERT_LINE" CHANGELOG.md > changelog.new
                  cat section.md >> changelog.new
                  tail -n "+$((INSERT_LINE + 1))" CHANGELOG.md >> changelog.new
                  mv changelog.new CHANGELOG.md

                  git add version.json package.json CHANGELOG.md
                  git commit -m "chore(versioning): auto-bump patch to $NEW_VERSION [skip ci]"
                  git push origin HEAD:main

            - name: Tag the release
              if: env.DONE != 'true'
              run: |
                  VERSION=$(node -p "require('./version.json').version")
                  # The tag push triggers release.yml (GitHub Release) and
                  # docker-publish.yml (GHCR image) automatically.
                  git tag "$VERSION"
                  git push origin "$VERSION"
                  echo "Tagged and pushed $VERSION."
