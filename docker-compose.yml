services:
    cosmos-all-in-one:
        build:
            context: .
            dockerfile: docker/Dockerfile
            args:
                NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
                NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://38.49.212.111:1623}
                NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://38.49.212.111:1623}
                NEXT_PUBLIC_BOT_NUMBER: ${BOT_PHONE_NUMBER:-}
                NEXT_PUBLIC_SALES_NUMBER: ${SALES_PHONE_NUMBER:-}
        image: cosmos-all-in-one:latest
        container_name: cosmos-all-in-one
        restart: unless-stopped
        env_file:
            - path: .env
              required: false
        environment:
            NODE_ENV: production
            DATABASE_URL: file:/app/storage/database.sqlite
            BOT_IPC_SOCKET: /app/storage/ipc.sock
            APP_DOMAIN: ${APP_DOMAIN:-38.49.212.111:1623}
        volumes:
            - ./storage:/app/storage
        # LXC NAT VPS: Host port 8080 (192.168.11.86:8080) forwards to public 38.49.212.111:1623.
        # Container port 80 (Nginx reverse proxy) is exposed on host port 8080.
        ports:
            - '${HOST_PORT_ALL_IN_ONE:-8080}:80'
