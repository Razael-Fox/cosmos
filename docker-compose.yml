services:
    cosmos-origin:
        build:
            context: .
            dockerfile: docker/Dockerfile
            args:
                NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
                NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:8080}
                NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
                NEXT_PUBLIC_BOT_NUMBER: ${BOT_PHONE_NUMBER:-}
                NEXT_PUBLIC_SALES_NUMBER: ${SALES_PHONE_NUMBER:-}
        image: cosmos-origin:latest
        container_name: cosmos-origin
        restart: unless-stopped
        env_file:
            - path: .env
              required: false
        environment:
            NODE_ENV: production
            DATABASE_URL: file:/app/storage/database.sqlite
            BOT_IPC_SOCKET: /app/storage/ipc.sock
            APP_DOMAIN: ${APP_DOMAIN:-localhost:8080}
        volumes:
            - ./storage:/app/storage
        # Container port 80 (Nginx reverse proxy) is exposed on host port 8080 by default.
        ports:
            - '${HOST_PORT_ORIGIN:-${HOST_PORT_ALL_IN_ONE:-8080}}:80'
